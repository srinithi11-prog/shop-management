<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Alteration & Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    input, select { padding: 5px; box-sizing: border-box; }
    button { padding: 6px 12px; cursor: pointer; }
    .danger { background-color: #dc3545; color: white; border: none; border-radius: 3px; }
    .primary { background-color: #0d6efd; color: white; border: none; border-radius: 3px; }
    .selected-tag { font-size: 11px; color: #6c757d; }
  </style>
</head>
<body>

  <h2>Bill Details & Modification</h2>
  
  <div id="alterSection">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Code</th>
          <th>Product Name</th>
          <th>Batch / Price</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="alterBody">
        <!-- Dynamic Rows Inserted Here -->
      </tbody>
    </table>

    <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <button type="button" class="primary" onclick="addAlterRow()">+ Add Item</button>
      </div>
      <div>
        <strong id="alterTotal" style="font-size: 16px;">Updated Net Total: ₹0.00</strong>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button type="button" class="primary" onclick="saveAlter()">Save Changes</button>
      <button type="button" class="danger" onclick="doCancelBill()">Cancel Bill</button>
    </div>
  </div>

<script>
const API = "http://localhost:3000/api"; // Adjust your backend API endpoint here
let currentBill = null;
let alterRowCount = 0;
let deletedItemIds = [];

// Helper function to escape HTML special characters
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Fetch batch options for a selected product
function loadAlterBatches(rowId, productId, selectedBatchId) {
  fetch(API + "/batches/" + productId)
    .then(res => res.json())
    .then(batches => {
      const select = document.getElementById("arbatch_" + rowId);
      if (!select) return;
      select.innerHTML = '<option value="">— Select —</option>';
      
      batches.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.batch_id || b.id;
        opt.innerText = "₹" + parseFloat(b.rate || b.selling_price || 0).toFixed(2);
        if (selectedBatchId && (b.batch_id == selectedBatchId || b.id == selectedBatchId)) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });
    })
    .catch(err => console.error("Error loading batches:", err));
}

// Handle Batch selection update
function onAB(id) {
  const select = document.getElementById("arbatch_" + id);
  const selectedOption = select.options[select.selectedIndex];
  if (selectedOption && selectedOption.innerText.includes("₹")) {
    const rateVal = parseFloat(selectedOption.innerText.replace("₹", "")) || 0;
    document.getElementById("arrate_" + id).value = rateVal.toFixed(2);
  }
  calcAR(id);
}

// Key handling placeholder for product autocomplete navigation
function handleAlterKey(event, id, type) {
  // Navigation key handler logic
}

// Dropdown search placeholder
function showProdDrop(elem, id, type) {
  // Product lookup dynamic dropdown logic
}

// View bill details setup
function viewBill(billId) {
  fetch(API + "/bill/" + billId)
    .then(r => r.json())
    .then(data => {
      currentBill = data;
      buildAlterRows(currentBill);
    })
    .catch(err => console.error("Error loading bill:", err));
}

// Reload master list/outstanding bill metrics
function loadOutstanding() {
  // Refresh UI metrics
}

// Build pre-populated rows for Alter Bill section
function buildAlterRows(b) {
  const tbody = document.getElementById("alterBody");
  tbody.innerHTML = "";
  alterRowCount = 0;
  deletedItemIds = [];
  
  if (b && b.items && b.items.length) {
    b.items.forEach(item => addAlterRowFromItem(item));
  } else {
    addAlterRow();
  }
  recalcAlterTotal();
}

// Add an existing bill item to the alter table
function addAlterRowFromItem(item) {
  alterRowCount++;
  const id = alterRowCount;
  const tbody = document.getElementById("alterBody");
  
  const tr = document.createElement("tr");
  tr.id = "alterRow_" + id;
  tr.innerHTML = `
    <td>${id}
      <input type="hidden" id="aritemid_${id}" value="${item.id || item.item_id || ''}">
      <input type="hidden" id="arpid_${id}" value="${item.product_id || ''}">
    </td>
    <td>
      <input id="arcode_${id}" value="${esc(item.product_code || '')}" placeholder="Code"
        oninput="showProdDrop(this, ${id}, 'code')" 
        onkeydown="handleAlterKey(event, ${id}, 'code')" autocomplete="off">
    </td>
    <td style="text-align:left;">
      <input id="arname_${id}" value="${esc(item.product_name || item.product || '')}" placeholder="Product Name"
        oninput="showProdDrop(this, ${id}, 'name')" 
        onkeydown="handleAlterKey(event, ${id}, 'name')" autocomplete="off">
      <div class="selected-tag" id="artag_${id}"></div>
    </td>
    <td>
      <select id="arbatch_${id}" onchange="onAB(${id})">
        <option value="${item.batch_id || ''}">₹${parseFloat(item.rate || item.selling_price || 0).toFixed(2)}</option>
      </select>
    </td>
    <td>
      <input type="number" id="arqty_${id}" value="${item.quantity || 1}" min="1" style="width:60px;" oninput="calcAR(${id})">
    </td>
    <td>
      <input type="number" id="arrate_${id}" value="${parseFloat(item.rate || item.selling_price || 0).toFixed(2)}" step="0.01" style="width:80px;" oninput="calcAR(${id})">
    </td>
    <td id="aramt_${id}">₹${parseFloat(item.total_amount || (item.quantity * item.rate) || 0).toFixed(2)}</td>
    <td>
      <button type="button" class="danger" style="padding:2px 6px;font-size:11px;" onclick="removeAlterRow(${id})">✕</button>
    </td>
  `;
  tbody.appendChild(tr);

  if (item.product_id) {
    loadAlterBatches(id, item.product_id, item.batch_id);
  }
}

// Add a blank new row to alter table
function addAlterRow() {
  alterRowCount++;
  const id = alterRowCount;
  const tbody = document.getElementById("alterBody");
  
  const tr = document.createElement("tr");
  tr.id = "alterRow_" + id;
  tr.innerHTML = `
    <td>${id}
      <input type="hidden" id="aritemid_${id}" value="">
      <input type="hidden" id="arpid_${id}" value="">
    </td>
    <td>
      <input id="arcode_${id}" placeholder="Code"
        oninput="showProdDrop(this, ${id}, 'code')" 
        onkeydown="handleAlterKey(event, ${id}, 'code')" autocomplete="off">
    </td>
    <td style="text-align:left;">
      <input id="arname_${id}" placeholder="Product Name"
        oninput="showProdDrop(this, ${id}, 'name')" 
        onkeydown="handleAlterKey(event, ${id}, 'name')" autocomplete="off">
      <div class="selected-tag" id="artag_${id}"></div>
    </td>
    <td>
      <select id="arbatch_${id}" onchange="onAB(${id})">
        <option value="">— Select —</option>
      </select>
    </td>
    <td>
      <input type="number" id="arqty_${id}" value="1" min="1" style="width:60px;" oninput="calcAR(${id})">
    </td>
    <td>
      <input type="number" id="arrate_${id}" value="0.00" step="0.01" style="width:80px;" oninput="calcAR(${id})">
    </td>
    <td id="aramt_${id}">₹0.00</td>
    <td>
      <button type="button" class="danger" style="padding:2px 6px;font-size:11px;" onclick="removeAlterRow(${id})">✕</button>
    </td>
  `;
  tbody.appendChild(tr);
}

// Remove row and record deleted item IDs to send back to server
function removeAlterRow(id) {
  const itemId = document.getElementById("aritemid_" + id).value;
  if (itemId) {
    deletedItemIds.push(itemId);
  }
  const row = document.getElementById("alterRow_" + id);
  if (row) row.remove();
  recalcAlterTotal();
}

// Calculate individual row total amount
function calcAR(id) {
  const qty = parseFloat(document.getElementById("arqty_" + id).value) || 0;
  const rate = parseFloat(document.getElementById("arrate_" + id).value) || 0;
  const amt = qty * rate;
  document.getElementById("aramt_" + id).innerText = "₹" + amt.toFixed(2);
  recalcAlterTotal();
}

// Recalculate total sum for altered items
function recalcAlterTotal() {
  let total = 0;
  const tbody = document.getElementById("alterBody");
  const rows = tbody.querySelectorAll("tr");
  
  rows.forEach(tr => {
    const id = tr.id.split("_")[1];
    const qty = parseFloat(document.getElementById("arqty_" + id).value) || 0;
    const rate = parseFloat(document.getElementById("arrate_" + id).value) || 0;
    total += qty * rate;
  });
  
  document.getElementById("alterTotal").innerText = "Updated Net Total: ₹" + total.toFixed(2);
}

// Save altered bill modifications via REST API
function saveAlter() {
  if (!currentBill) {
    alert("No active bill selected to save modifications.");
    return;
  }
  
  const tbody = document.getElementById("alterBody");
  const rows = tbody.querySelectorAll("tr");
  const items = [];
  
  for (let tr of rows) {
    const id = tr.id.split("_")[1];
    const productId = document.getElementById("arpid_" + id).value;
    const batchId = document.getElementById("arbatch_" + id).value;
    const qty = parseFloat(document.getElementById("arqty_" + id).value) || 0;
    const rate = parseFloat(document.getElementById("arrate_" + id).value) || 0;
    const itemId = document.getElementById("aritemid_" + id).value;

    if (!productId || qty <= 0) {
      alert("Please ensure all items have a valid product and quantity greater than 0.");
      return;
    }

    items.push({
      item_id: itemId || null,
      product_id: parseInt(productId),
      batch_id: batchId ? parseInt(batchId) : null,
      quantity: qty,
      rate: rate,
      total_amount: qty * rate
    });
  }

  const payload = {
    bill_id: currentBill.bill_id,
    deleted_items: deletedItemIds,
    items: items
  };

  fetch(API + "/alter-bill", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    if (res.success || res.status === "success") {
      alert("Bill altered successfully!");
      viewBill(currentBill.bill_id);
      loadOutstanding();
    } else {
      alert("Failed to alter bill: " + (res.message || "Unknown error"));
    }
  })
  .catch(err => alert("Error updating bill: " + err.message));
}

// Cancel active bill
function doCancelBill() {
  if (!currentBill) {
    alert("No active bill selected to cancel.");
    return;
  }
  
  if (!confirm("Are you sure you want to cancel Q-Bill #" + (currentBill.bill_no || currentBill.bill_id) + "? This action will restore stock.")) {
    return;
  }

  fetch(API + "/cancel-bill/" + currentBill.bill_id, {
    method: "POST"
  })
  .then(r => r.json())
  .then(res => {
    if (res.success || res.status === "success") {
      alert("Bill cancelled successfully.");
      viewBill(currentBill.bill_id);
      loadOutstanding();
    } else {
      alert("Failed to cancel bill: " + (res.message || "Error"));
    }
  })
  .catch(err => alert("Error cancelling bill: " + err.message));
}
</script>
</body>
</html>
