    .prod-drop.open{display:block;}
    .prod-drop-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;}
    .prod-drop-item:hover,.prod-drop-item.dp-active{background:#e8f0ff;}
    .pdi-code{font-size:11px;color:#007bff;font-weight:bold;font-family:monospace;}

    table.alter-tbl td input{padding:5px;font-size:12px;border:1px solid #ccc;border-radius:4px;width:100%;}
  </style>

<div class="container">
  <!-- Customer Details Card -->

<div class="prod-drop" id="prodDrop"></div>

<script>
const API="http://localhost:3000";
const SHOP="SUN CERAMIC",PHONE_NO="9942607766";
if(!sessionStorage.getItem("loggedIn"))window.location.href="login.html";

let allCustomers=[],allProducts=[],createdBill=null;
let rowCount=0;
let activeInput=null,activeRow=null,dropIdx=-1,custIdx=-1;

function esc(str){
  return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

window.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("billDate").valueAsDate = new Date();
  fetch(API+"/customers").then(r=>r.json()).then(d=>{allCustomers=d;}).catch(()=>{});
  fetch(API+"/products").then(r=>r.json()).then(d=>{allProducts=d;}).catch(()=>{});
  addRow();

  document.addEventListener("mousedown",e=>{
    const cd=document.getElementById("custDrop");
    if(cd&&!cd.contains(e.target)&&e.target!==document.getElementById("custName"))cd.style.display="none";
    const pd=document.getElementById("prodDrop");
    if(pd&&!pd.contains(e.target)&&e.target!==activeInput)hideProdDrop();
  });
});

// Customer Search Dropdown
function onCustSearch(){
  const q=document.getElementById("custName").value.trim().toLowerCase();
  const drop=document.getElementById("custDrop");
  custIdx=-1;
  document.getElementById("custSelected").innerText="";
  if(q.length<1){drop.style.display="none";return;}
  const matches=allCustomers.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||"").includes(q)).slice(0,10);
  if(!matches.length){drop.style.display="none";return;}
  drop.innerHTML=matches.map((c,i)=>`
    <div class="cust-drop-item" id="cdi_${i}" onmousedown="pickCustomer('${esc(c.name)}','${esc(c.phone||"")}')">
      <b>${c.name}</b>${c.phone?" | "+c.phone:""}
    </div>`).join("");
  drop.style.display="block";
}

function custDropKey(e){
  const drop=document.getElementById("custDrop");
  const items=drop.querySelectorAll(".cust-drop-item");
  if(!items.length||drop.style.display==="none") return;
  if(e.key==="ArrowDown"){e.preventDefault();custIdx=Math.min(custIdx+1,items.length-1);hlC(items);return;}
  if(e.key==="ArrowUp"){e.preventDefault();custIdx=Math.max(custIdx-1,0);hlC(items);return;}
  if(e.key==="Enter"){
    if(custIdx>=0){e.preventDefault();items[custIdx].dispatchEvent(new MouseEvent("mousedown",{bubbles:true}));return;}
    drop.style.display="none";
  }
  if(e.key==="Escape"){drop.style.display="none";custIdx=-1;}
}

function hlC(items){
  items.forEach((el,i)=>el.classList.toggle("dp-active",i===custIdx));
  if(items[custIdx])items[custIdx].scrollIntoView({block:"nearest"});
}

function pickCustomer(name,phone){
  document.getElementById("custName").value=name;
  document.getElementById("custPhone").value=phone;
  document.getElementById("custSelected").innerText="✅ "+name;
  document.getElementById("custDrop").style.display="none";
  custIdx=-1;
}

// Product Dropdown
function showProdDrop(inputEl,rowId,fieldType){
  activeInput=inputEl;activeRow=rowId;dropIdx=-1;
  const q=inputEl.value.trim().toLowerCase();
  const drop=document.getElementById("prodDrop");
  if(q.length<1){hideProdDrop();return;}
  const matches=(fieldType==="code"?allProducts.filter(p=>(p.product_code||"").toLowerCase().includes(q)):allProducts.filter(p=>p.name.toLowerCase().includes(q))).slice(0,10);
  if(!matches.length){hideProdDrop();return;}
  drop.innerHTML=matches.map((p,i)=>`
    <div class="prod-drop-item" id="pdrop_${i}" onmousedown="pickProduct(event,${p.product_id},'${esc(p.name)}','${esc(p.product_code||"")}')">
      <div class="pdi-code">${p.product_code||"(no code)"}</div>
      <div class="pdi-name">${p.name}${p.brand?" — "+p.brand:""}</div>
    </div>`).join("");
  const rect=inputEl.getBoundingClientRect();
  drop.style.top=(rect.bottom+2)+"px";drop.style.left=rect.left+"px";drop.style.width=Math.max(rect.width,240)+"px";
  drop.classList.add("open");
}

function hideProdDrop(){document.getElementById("prodDrop").classList.remove("open");dropIdx=-1;activeInput=null;}

function handleRowKey(e,rowId,fieldType){
  const drop=document.getElementById("prodDrop");const isOpen=drop.classList.contains("open");const items=drop.querySelectorAll(".prod-drop-item");
  if(e.key==="ArrowDown"){
    e.preventDefault();
    if(!isOpen)showProdDrop(e.target,rowId,fieldType);
    dropIdx=Math.min(dropIdx+1,items.length-1);
    items.forEach((el,i)=>el.classList.toggle("dp-active",i===dropIdx));
    if(items[dropIdx])items[dropIdx].scrollIntoView({block:"nearest"});
    return;
  }
  if(e.key==="ArrowUp"){
    e.preventDefault();
    dropIdx=Math.max(dropIdx-1,0);
    items.forEach((el,i)=>el.classList.toggle("dp-active",i===dropIdx));
    if(items[dropIdx])items[dropIdx].scrollIntoView({block:"nearest"});
    return;
  }
  if(e.key==="Enter"){
    if(isOpen&&dropIdx>=0&&items[dropIdx]){
      e.preventDefault();
      items[dropIdx].dispatchEvent(new MouseEvent("mousedown",{bubbles:true}));
      return;
    }
    if(isOpen&&items.length===1){
      e.preventDefault();
      items[0].dispatchEvent(new MouseEvent("mousedown",{bubbles:true}));
      return;
    }
    e.preventDefault();
    const q=document.getElementById("rqty_"+rowId);
    if(q)q.focus();
    return;
  }
  if(e.key==="Escape")hideProdDrop();
  if(e.key==="Tab")hideProdDrop();
}

function pickProduct(e,pid,name,code){
  e.preventDefault();const id=activeRow;
  document.getElementById("rcode_"+id).value=code;
  document.getElementById("rname_"+id).value=name;
  document.getElementById("rpid_"+id).value=pid;
  document.getElementById("rtag_"+id).innerText="✅ "+name;
  hideProdDrop();
  loadBatches(id,pid);
  setTimeout(()=>{const q=document.getElementById("rqty_"+id);if(q)q.focus();},50);
}

function loadBatches(rowId,pid){
  if(!pid)return;
  const sel=document.getElementById("rbatch_"+rowId);
  sel.innerHTML=`<option value="">Loading...</option>`;
  fetch(API+"/batches/"+pid).then(r=>r.json()).then(batches=>{
    if(!batches.length){sel.innerHTML=`<option value="">No stock</option>`;return;}
    sel.innerHTML=`<option value="">— Select price —</option>`;
    batches.forEach(b=>{
      sel.innerHTML+=`<option value="${b.batch_id}" data-mrp="${b.mrp}">₹${parseFloat(b.mrp).toFixed(2)} | Stk:${b.remaining_quantity}</option>`;
    });
  });
}

function onBatchChange(rowId){
  const sel=document.getElementById("rbatch_"+rowId);
  const opt=sel.options[sel.selectedIndex];
  if(opt && opt.dataset.mrp){
    document.getElementById("rrate_"+rowId).value = parseFloat(opt.dataset.mrp).toFixed(2);
    calcRow(rowId);
  }
}

// Table Rows Setup
function addRow(){
  rowCount++;const id=rowCount;
  const tr=document.createElement("tr");tr.id="brow_"+id;
  tr.innerHTML=`
    <td>${id}</td>
    <td><input id="rcode_${id}" placeholder="Code"
      oninput="showProdDrop(this,${id},'code')" onfocus="showProdDrop(this,${id},'code')"
      onkeydown="handleRowKey(event,${id},'code')" autocomplete="off"></td>
    <td><input id="rname_${id}" placeholder="Name"
      oninput="showProdDrop(this,${id},'name')" onfocus="showProdDrop(this,${id},'name')"
      onkeydown="handleRowKey(event,${id},'name')" autocomplete="off">
      <div class="selected-tag" id="rtag_${id}"></div>
      <input type="hidden" id="rpid_${id}">
    </td>
    <td><select id="rbatch_${id}" onchange="onBatchChange(${id})"><option value="">Select product</option></select></td>
    <td><input type="number" id="rqty_${id}" value="1" min="1" oninput="calcRow(${id})" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('rrate_'+${id}).focus();}"></td>
    <td><input type="number" id="rrate_${id}" value="0.00" oninput="calcRow(${id})" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('ramt_'+${id}).focus();}"></td>
    <td><input type="number" id="ramt_${id}" value="0.00" oninput="calcTotal()"></td>
    <td><button class="danger" onclick="delRow(${id})" style="padding:3px 7px;font-size:11px;">✕</button></td>`;
  document.getElementById("billBody").appendChild(tr);
}

function delRow(rowId){
  const row=document.getElementById("brow_"+rowId);
  if(row) row.remove();
  calcTotal();
}

function calcRow(rowId){
  const qty=parseFloat(document.getElementById("rqty_"+rowId).value)||0;
  const rate=parseFloat(document.getElementById("rrate_"+rowId).value)||0;
  document.getElementById("ramt_"+rowId).value = (qty * rate).toFixed(2);
  calcTotal();
}

function calcTotal(){
  let total=0;
  const rows=document.querySelectorAll("#billBody tr");
  rows.forEach(tr=>{
    const amtInput=tr.querySelector("input[id^='ramt_']");
    if(amtInput) total += parseFloat(amtInput.value)||0;
  });
  document.getElementById("billTotal").innerText="Total: ₹" + total.toFixed(2);
}

function clearBill(){
  document.getElementById("custName").value="";
  document.getElementById("custPhone").value="";
  document.getElementById("custSelected").innerText="";
  document.getElementById("payMode").value="Cash";
  document.getElementById("billDate").valueAsDate=new Date();
  document.getElementById("billBody").innerHTML="";
  document.getElementById("previewCard").style.display="none";
  rowCount=0;
  addRow();
  calcTotal();
}

// Save & Create Bill
function saveAndGenerateBill(){
  const custName=document.getElementById("custName").value.trim()||"Walk-in";
  const phone=document.getElementById("custPhone").value.trim();
  const payMode=document.getElementById("payMode").value;
  const billDate=document.getElementById("billDate").value;

  const rows=document.querySelectorAll("#billBody tr");
  const items=[];
  for(let tr of rows){
    const id = tr.id.replace("brow_","");
    const product_id = document.getElementById("rpid_"+id).value;
    const batch_id = document.getElementById("rbatch_"+id).value;
    const qty = parseInt(document.getElementById("rqty_"+id).value)||0;
    const rate = parseFloat(document.getElementById("rrate_"+id).value)||0;
    const total_amount = parseFloat(document.getElementById("ramt_"+id).value)||0;
    const prodName = document.getElementById("rname_"+id).value;

    if(!product_id){
      alert("Please select a product for all rows.");
      return;
    }
    items.push({ product_id, batch_id, quantity: qty, rate, total_amount, product_name: prodName });
  }

  if(!items.length){
    alert("Please add at least one item.");
    return;
  }

  const payload = {
    customer_name: custName,
    phone: phone,
    payment_mode: payMode,
    bill_date: billDate,
    items: items
  };

  fetch(API + "/create-bill", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(data => {
    if(data.success || data.bill_id){
      alert("Bill saved successfully!");
      const billId = data.bill_id || data.id;
      fetch(API + "/bill/" + billId).then(r=>r.json()).then(b=>{
        createdBill = b;
        createdBill.bill_id = billId;
        buildInvoiceDisplay(b);
        document.getElementById("previewCard").style.display="block";
        document.getElementById("previewCard").scrollIntoView({behavior:"smooth"});
      });
    } else {
      alert("Failed to save bill: " + (data.error || "Unknown error"));
    }
  })
  .catch(err => alert("Error: " + err.message));
}

// Helper to convert number to words
function toWords(n){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  n=Math.round(n);if(n===0)return"Zero";if(n<20)return a[n];if(n<100)return t[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  if(n<1000)return a[Math.floor(n/100)]+" Hundred"+(n%100?" "+toWords(n%100):"");
  if(n<100000)return toWords(Math.floor(n/1000))+" Thousand"+(n%1000?" "+toWords(n%1000):"");
  if(n<10000000)return toWords(Math.floor(n/100000))+" Lakh"+(n%100000?" "+toWords(n%100000):"");
  return toWords(Math.floor(n/10000000))+" Crore"+(n%10000000?" "+toWords(n%10000000):"");
}

// Display invoice on screen
function buildInvoiceDisplay(b){
  const dateStr=new Date(b.bill_date).toLocaleDateString("en-IN");
  const custName=b.customer&&b.customer!=="Walk-in"?b.customer:(b.walkin_name||"Walk-in");
  const total=parseFloat(b.total||0);
  const roundedAdd=parseFloat(b.rounded_off||0);
  const netAmount=parseFloat(b.net_amount||total);
  const amtWords=toWords(Math.round(netAmount))+" Only";
  const billNo = b.bill_no || b.bill_id;
  
  let rows="",totalQty=0;
  const items = b.items || [];
  
  for(let i=0; i<20; i++){
    if(i < items.length) {
      const item = items[i];
      const qtyVal = parseInt(item.quantity||0);
      totalQty += qtyVal;
      rows += `<tr style="height:18px;">
        <td style="text-align:left;border:1px solid #000;padding:2px 6px;font-size:11px;color:#6c757d;">${item.product||item.product_name||"-"}</td>
        <td style="text-align:center;border:1px solid #000;padding:2px 6px;">${qtyVal} Nos</td>
        <td style="text-align:right;border:1px solid #000;padding:2px 6px;">${parseFloat(item.rate||0).toFixed(2)}</td>
        <td style="text-align:right;border:1px solid #000;padding:2px 6px;">${parseFloat(item.total_amount||0).toFixed(2)}</td>
      </tr>`;
    } else {
      rows += `<tr style="height:18px;">
        <td style="border:1px solid #000;">&nbsp;</td>
        <td style="border:1px solid #000;"></td>
        <td style="border:1px solid #000;"></td>
        <td style="border:1px solid #000;"></td>
      </tr>`;
    }
  }
  document.getElementById("invoiceArea").innerHTML=`
    <div style="font-family:'Arial',sans-serif;padding:20px;border:1px solid #000;background:#fff;width:100%;max-width:550px;margin:auto;">
      <div style="text-align:right;font-size:11px;font-weight:bold;">CELL: ${PHONE_NO}</div>

// Print Bill
function printBill(){
  if(!createdBill){alert("No bill to print");return;}
  const b=createdBill;
  const dateStr=new Date(b.bill_date).toLocaleDateString("en-IN");
  const custName=b.customer&&b.customer!=="Walk-in"?b.customer:(b.walkin_name||"Walk-in");
  const total=parseFloat(b.total||0);
  const roundedAdd=parseFloat(b.rounded_off||0);
  const netAmount=parseFloat(b.net_amount||total);
  const amtWords=toWords(Math.round(netAmount))+" Only";
  const billNo = b.bill_no || b.bill_id;
  
  let itemRows="",totalQty=0;
  const items = b.items || [];
  for(let i=0; i<20; i++){

        <td style="text-align:center;">${qtyVal} Nos</td>
        <td style="text-align:right;">${parseFloat(item.rate||item.selling_price||0).toFixed(2)}</td>

// Share PDF
async function sharePDF(){
  const btn=document.getElementById("sharePdfBtn");
  const orig=btn.innerText;btn.innerText="⏳...";btn.disabled=true;
  try{
    const {jsPDF}=window.jspdf;
    const canvas=await html2canvas(document.getElementById("invoiceArea"),{scale:2,backgroundColor:"#ffffff"});
    const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a5"});
    const pw=pdf.internal.pageSize.getWidth()-10;
    pdf.addImage(canvas.toDataURL("image/png"),"PNG",5,5,pw,(canvas.height*pw)/canvas.width);
    const fname="Q-Bill-"+(createdBill?(createdBill.bill_no||createdBill.bill_id):"bill")+".pdf";
    if(navigator.share){
      const blob=pdf.output("blob");
      const file=new File([blob],fname,{type:"application/pdf"});
      try{
        await navigator.share({files:[file],title:"Q Bill",text:"Q Bill from "+SHOP});
        btn.innerText=orig;btn.disabled=false;
        return;
      }catch(ex){}
    }
    pdf.save(fname);
  }catch(e){alert("PDF error: "+e.message);}
  btn.innerText=orig;btn.disabled=false;
}
</script>
</body>
